[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ig-ingest"
version = "0.1.0"
description = "Instagram ingestion prototype: public handles or post URLs in, normalized post records out."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Free fallback tier (logged-out). Pinned on purpose: upgrade only after canary checks.
free = ["instaloader==4.16"]
dev = ["pytest>=8"]

[project.scripts]
ig-ingest = "ig_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
