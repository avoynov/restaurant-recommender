name: Test

on:
  pull_request:
    paths: ["ingestion/**", ".github/workflows/test.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: ingestion
